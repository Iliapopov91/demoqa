name: Test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Выкачиваем репозиторий
      - uses: actions/checkout@v4

      # Настраиваем Java
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Запускаем Selenoid
      - uses: Xotabu4/selenoid-github-action@v2

      # Даем права на запуск Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Проверяем, что Selenoid запустился
      - name: Check Selenoid is up
        run: curl -sSf http://localhost:4444/status

      # Запускаем тесты
      - name: Run tests
        run: ./gradlew clean test --info --stacktrace -Dselenide.remote=http://localhost:4444/wd/hub

      # Получаем предыдущую историю Allure
      # Если ветки gh-pages пока нет — шаг не ломает workflow
      - name: Checkout gh-pages
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # Генерируем Allure Report
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: build/allure-results
          allure_report: allure-report
          allure_history: allure-history

      # Публикуем Allure Report в gh-pages
      - name: Publish Allure Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history